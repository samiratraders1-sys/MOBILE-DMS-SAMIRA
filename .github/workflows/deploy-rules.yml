name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        id: check
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SA" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::সিক্রেট সেট করা নেই — ডিপ্লয় স্কিপ করা হলো।"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Validate service account JSON
        if: steps.check.outputs.configured == 'true'
        id: sa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          if ! node -e "JSON.parse(require('fs').readFileSync('/tmp/sa.json','utf8'))"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT সিক্রেটটা বৈধ JSON নয়"
            exit 1
          fi
          PID=$(node -e "process.stdout.write(require('/tmp/sa.json').project_id || '')")
          [ -z "$PID" ] && { echo "::error::JSON-এ project_id নেই"; exit 1; }
          echo "project_id=$PID" >> "$GITHUB_OUTPUT"
          echo "service account OK, project_id = $PID"

      - name: Resolve target project & database from app config
        if: steps.check.outputs.configured == 'true'
        id: target
        run: |
          TARGET=$(jq -r .projectId firebase-applet-config.json)
          DBID=$(jq -r '.firestoreDatabaseId // "(default)"' firebase-applet-config.json)
          [ -z "$TARGET" ] || [ "$TARGET" = "null" ] && { echo "::error::firebase-applet-config.json-এ projectId নেই"; exit 1; }
          echo "target project = $TARGET, database = $DBID"
          SA_PID="${{ steps.sa.outputs.project_id }}"
          if [ "$SA_PID" != "$TARGET" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT সিক্রেটটা ভুল প্রজেক্টের — সিক্রেটে আছে '$SA_PID', অথচ অ্যাপ ব্যবহার করে '$TARGET'।"
            echo "$TARGET প্রজেক্টে নতুন service account তৈরি করে (Firebase Rules Admin রোল সহ) সেই JSON key দিয়ে সিক্রেট আপডেট করুন।"
            exit 1
          fi
          echo "project=$TARGET" >> "$GITHUB_OUTPUT"
          echo "database=$DBID" >> "$GITHUB_OUTPUT"

      - name: Mint access token
        if: steps.check.outputs.configured == 'true'
        run: |
          node -e '
            (async () => {
              const fs = require("fs"), crypto = require("crypto");
              const sa = JSON.parse(fs.readFileSync("/tmp/sa.json", "utf8"));
              const b64 = o => Buffer.from(JSON.stringify(o)).toString("base64url");
              const iat = Math.floor(Date.now() / 1000);
              const claims = { iss: sa.client_email, scope: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/datastore https://www.googleapis.com/auth/firebase", aud: "https://oauth2.googleapis.com/token", iat, exp: iat + 3000 };
              const jwt = b64({ alg: "RS256", typ: "JWT" }) + "." + b64(claims);
              const sig = crypto.createSign("RSA-SHA256").update(jwt).sign(sa.private_key, "base64url");
              const res = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: jwt + "." + sig })
              });
              const j = await res.json();
              if (!j.access_token) { console.error("TOKEN ERROR:", JSON.stringify(j)); process.exit(1); }
              fs.writeFileSync("/tmp/tok", j.access_token);
              console.log("access token OK");
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Ensure APIs are enabled
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.sa.outputs.project_id }}"
          for API in firebaserules.googleapis.com firestore.googleapis.com serviceusage.googleapis.com; do
            echo "enabling $API ..."
            curl -s -X POST "https://serviceusage.googleapis.com/v1/projects/$PROJ/services/$API:enable" \
              -H "Authorization: Bearer $TOKEN" | head -c 300
            echo ""
          done

      - name: Create Firestore database if missing
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.target.outputs.project }}"
          DBID="${{ steps.target.outputs.database }}"
          echo "checking database '$DBID' in $PROJ ..."
          GET=$(curl -s "https://firestore.googleapis.com/v1/projects/$PROJ/databases/$DBID" \
            -H "Authorization: Bearer $TOKEN")
          if echo "$GET" | grep -q '"name"'; then
            echo "ডাটাবেস আগে থেকেই আছে — ঠিক আছে"
          elif echo "$GET" | grep -q "PERMISSION_DENIED"; then
            echo "::warning::ডাটাবেস আছে কি না যাচাই করা গেল না (403) — service account-এর datastore.databases.get পারমিশন নেই।"
            echo "ডিপ্লয় চেষ্টা চলবে; ব্যর্থ হলে Firebase Console-এ Firestore ডাটাবেস তৈরি আছে কি না দেখুন, নাহলে IAM-এ 'Cloud Datastore Owner' রোল দিন।"
          else
            echo "ডাটাবেস নেই — তৈরি করছি (asia-south1) ..."
            # FIX: databaseId অবশ্যই query parameter হতে হবে, JSON body-তে নয় (আগে 400 INVALID_ARGUMENT হচ্ছিল)
            RESP=$(curl -s -X POST "https://firestore.googleapis.com/v1/projects/$PROJ/databases?databaseId=$DBID" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d '{"locationId":"asia-south1","type":"FIRESTORE_NATIVE"}')
            echo "$RESP" | head -c 400
            echo ""
            if echo "$RESP" | grep -q "ALREADY_EXISTS"; then
              echo "ডাটাবেস আগে থেকেই আছে — ঠিক আছে"
            elif echo "$RESP" | grep -q '"name"'; then
              OP=$(echo "$RESP" | node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).name||'')}catch(e){}")
              echo "operation: $OP — সম্পূর্ণ হওয়ার অপেক্ষায় ..."
              for i in $(seq 1 24); do
                sleep 5
                ST=$(curl -s "https://firestore.googleapis.com/v1/$OP" -H "Authorization: Bearer $TOKEN")
                if echo "$ST" | grep -q '"done": true'; then
                  echo "ডাটাবেস তৈরি সম্পূর্ণ ✅"
                  break
                fi
              done
            elif echo "$RESP" | grep -q "403\|PERMISSION"; then
              echo "::error::পারমিশন নেই (403) — service account-এর Firestore ডাটাবেস তৈরির অনুমতি (datastore.databases.create) নেই।"
              echo "দুটি সমাধানের যেকোনো একটি করুন: (১) Firebase Console → প্রজেক্ট → Firestore Database → Create database (asia-south1) — তারপর আবার এই ওয়ার্কফ্লো চালান;"
              echo "অথবা (২) Google Cloud Console → IAM & Admin → IAM → এই service account-এ 'Cloud Datastore Owner' রোল দিন — তারপর আবার চালান।"
              exit 1
            else
              echo "::error::ডাটাবেস তৈরি ব্যর্থ — উপরের এররটা দেখুন"
              exit 1
            fi
          fi

      - name: Deploy rules via Firebase Rules API
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.sa.outputs.project_id }}"
          RULES=$(jq -Rs . firestore.rules)
          DBID="${{ steps.target.outputs.database }}"
          echo "creating ruleset (database: $DBID) ..."
          # নেমড ডাটাবেসের জন্য attachment_point লাগবে (docs: firestore.googleapis.com/projects/P/databases/DB)
          if [ "$DBID" = "(default)" ]; then
            BODY="{\"source\":{\"files\":[{\"name\":\"firestore.rules\",\"content\":$RULES}]}}"
          else
            BODY="{\"source\":{\"files\":[{\"name\":\"firestore.rules\",\"content\":$RULES}],\"attachment_point\":\"firestore.googleapis.com/projects/$PROJ/databases/$DBID\"}}"
          fi
          curl -s -X POST "https://firebaserules.googleapis.com/v1/projects/$PROJ/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" \
            -o /tmp/rs.json
          cat /tmp/rs.json
          echo ""
          RS=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/rs.json','utf8')).name||'')}catch(e){}")
          if [ -z "$RS" ]; then
            echo "::error::ruleset তৈরি ব্যর্থ — উপরের এররটা দেখুন"
            exit 1
          fi
          echo "ruleset OK: $RS"
          echo "attaching to release cloud.firestore/$DBID ..."
          REL="projects/$PROJ/releases/cloud.firestore/$DBID"
          # নতুন ডাটাবেস প্রভিশন হতে কিছু সময় লাগতে পারে — তাই রিলিজে রিট্রাই লুপ
          for i in 1 2 3 4 5; do
            # আগে PATCH (আপডেট); রিলিজ না থাকলে NOT_FOUND দিলে POST-এ তৈরি
            FINAL=$(curl -s -X PATCH "https://firebaserules.googleapis.com/v1/$REL" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"name\":\"$REL\",\"rulesetName\":\"$RS\"}")
            if echo "$FINAL" | grep -q "NOT_FOUND"; then
              FINAL=$(curl -s -X POST "https://firebaserules.googleapis.com/v1/projects/$PROJ/releases" \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                -d "{\"name\":\"$REL\",\"rulesetName\":\"$RS\"}")
            fi
            echo "$FINAL" | head -c 500
            echo ""
            if echo "$FINAL" | grep -q '"name"'; then
              echo "🎉 রুলস লাইভ হয়ে গেছে!"
              exit 0
            fi
            echo "রিলিজ এখনো রেডি নয় (প্রচেষ্টা $i/৫) — ৫ সেকেন্ড পর আবার ..."
            sleep 5
          done
          echo "::error::release আপডেট ব্যর্থ — উপরের এররটা দেখুন"
          exit 1
