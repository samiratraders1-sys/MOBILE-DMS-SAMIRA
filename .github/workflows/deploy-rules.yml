name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: check
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SA" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::সিক্রেট সেট করা নেই — ডিপ্লয় স্কিপ করা হলো। Settings → Secrets → Actions-এ FIREBASE_SERVICE_ACCOUNT দিলে পরের রানে ডিপ্লয় হবে।"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      - run: npm install -g firebase-tools
        if: steps.check.outputs.configured == 'true'

      - name: Validate service account JSON
        if: steps.check.outputs.configured == 'true'
        id: sa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          if ! node -e "JSON.parse(require('fs').readFileSync('/tmp/sa.json','utf8'))"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT সিক্রেটটা বৈধ JSON নয় — পুরো service account ফাইলের ভেতরের লেখা { থেকে } পর্যন্ত হুবহু পেস্ট করতে হবে"
            exit 1
          fi
          PID=$(node -e "process.stdout.write(require('/tmp/sa.json').project_id || '')")
          if [ -z "$PID" ]; then
            echo "::error::JSON-এ project_id পাওয়া যায়নি — এটা কি সত্যিই Firebase service account ফাইল?"
            exit 1
          fi
          echo "project_id=$PID" >> "$GITHUB_OUTPUT"
          echo "service account OK, project_id = $PID"

      - name: Deploy Firestore rules
        if: steps.check.outputs.configured == 'true'
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json
          firebase deploy --only firestore:rules --project "${{ steps.sa.outputs.project_id }}" --non-interactive
