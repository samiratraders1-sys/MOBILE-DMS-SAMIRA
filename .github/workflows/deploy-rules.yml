name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        id: check
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_SA" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::সিক্রেট সেট করা নেই — ডিপ্লয় স্কিপ করা হলো।"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '20'

      - name: Validate service account JSON
        if: steps.check.outputs.configured == 'true'
        id: sa
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          if ! node -e "JSON.parse(require('fs').readFileSync('/tmp/sa.json','utf8'))"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT সিক্রেটটা বৈধ JSON নয়"
            exit 1
          fi
          PID=$(node -e "process.stdout.write(require('/tmp/sa.json').project_id || '')")
          [ -z "$PID" ] && { echo "::error::JSON-এ project_id নেই"; exit 1; }
          echo "project_id=$PID" >> "$GITHUB_OUTPUT"
          echo "service account OK, project_id = $PID"

      - name: Mint access token
        if: steps.check.outputs.configured == 'true'
        run: |
          node -e '
            (async () => {
              const fs = require("fs"), crypto = require("crypto");
              const sa = JSON.parse(fs.readFileSync("/tmp/sa.json", "utf8"));
              const b64 = o => Buffer.from(JSON.stringify(o)).toString("base64url");
              const iat = Math.floor(Date.now() / 1000);
              const claims = { iss: sa.client_email, scope: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/datastore https://www.googleapis.com/auth/firebase", aud: "https://oauth2.googleapis.com/token", iat, exp: iat + 3000 };
              const jwt = b64({ alg: "RS256", typ: "JWT" }) + "." + b64(claims);
              const sig = crypto.createSign("RSA-SHA256").update(jwt).sign(sa.private_key, "base64url");
              const res = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: jwt + "." + sig })
              });
              const j = await res.json();
              if (!j.access_token) { console.error("TOKEN ERROR:", JSON.stringify(j)); process.exit(1); }
              fs.writeFileSync("/tmp/tok", j.access_token);
              console.log("access token OK");
            })().catch(e => { console.error(e); process.exit(1); });
          '

      - name: Ensure APIs are enabled
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.sa.outputs.project_id }}"
          for API in firebaserules.googleapis.com firestore.googleapis.com serviceusage.googleapis.com; do
            echo "enabling $API ..."
            curl -s -X POST "https://serviceusage.googleapis.com/v1/projects/$PROJ/services/$API:enable" \
              -H "Authorization: Bearer $TOKEN" | head -c 300
            echo ""
          done

      - name: Create Firestore database if missing
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.sa.outputs.project_id }}"
          echo "checking/creating (default) database in $PROJ ..."
          RESP=$(curl -s -X POST "https://firestore.googleapis.com/v1/projects/$PROJ/databases" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"databaseId":"(default)","locationId":"asia-south1","type":"FIRESTORE_NATIVE"}')
          echo "$RESP" | head -c 400
          echo ""
          if echo "$RESP" | grep -q "ALREADY_EXISTS"; then
            echo "ডাটাবেস আগে থেকেই আছে — ঠিক আছে"
          elif echo "$RESP" | grep -q '"name"'; then
            echo "ডাটাবেস তৈরি হয়েছে ✅"
          elif echo "$RESP" | grep -q "403\|PERMISSION"; then
            echo "::error::পারমিশন নেই (403) — service account-এর Editor রোল সেভ হয়নি বা এখনো কার্যকর হয়নি। ৫ মিনিট পর আবার চালান, নাহলে IAM-এ রোলটা যাচাই করুন।"
            exit 1
          fi

      - name: Deploy rules via Firebase Rules API
        if: steps.check.outputs.configured == 'true'
        run: |
          TOKEN=$(cat /tmp/tok)
          PROJ="${{ steps.sa.outputs.project_id }}"
          RULES=$(jq -Rs . firestore.rules)
          echo "creating ruleset ..."
          curl -s -X POST "https://firebaserules.googleapis.com/v1/projects/$PROJ/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"source\":{\"files\":[{\"name\":\"firestore.rules\",\"content\":$RULES}]}}" \
            -o /tmp/rs.json
          cat /tmp/rs.json
          echo ""
          RS=$(node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync('/tmp/rs.json','utf8')).name||'')}catch(e){}")
          if [ -z "$RS" ]; then
            echo "::error::ruleset তৈরি ব্যর্থ — উপরের এররটা দেখুন"
            exit 1
          fi
          echo "ruleset OK: $RS"
          echo "attaching to release cloud.firestore ..."
          FINAL=$(curl -s -X PUT "https://firebaserules.googleapis.com/v1/projects/$PROJ/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"name\":\"projects/$PROJ/releases/cloud.firestore\",\"rulesetName\":\"$RS\"}")
          echo "$FINAL" | head -c 500
          echo ""
          if echo "$FINAL" | grep -q '"name"'; then
            echo "🎉 রুলস লাইভ হয়ে গেছে!"
          else
            echo "::error::release আপডেট ব্যর্থ — উপরের এররটা দেখুন"
            exit 1
          fi
