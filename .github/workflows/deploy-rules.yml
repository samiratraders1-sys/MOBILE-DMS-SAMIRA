name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          firebase deploy --only firestore:rules --project "$GCLOUD_PROJECT" --service-account /tmp/sa.json --non-interactive || \
          firebase deploy --only firestore:rules --project "$GCLOUD_PROJECT" --non-interactive
        # নোট: রিপো সিক্রেটে FIREBASE_SERVICE_ACCOUNT (সার্ভিস অ্যাকাউন্ট JSON-এর পুরো কনটেন্ট)
        # এবং GCLOUD_PROJECT (ফায়ারবেস প্রজেক্ট আইডি) সেট করতে হবে।
